<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b46"><title>Wayline — Offline</title></head>
  <body style="margin:0;background:#f4f7fb;color:#18324c;font:16px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:24px;box-sizing:border-box">
    <main style="max-width:440px;background:white;border:1px solid #e3eaf1;border-radius:20px;padding:32px;box-shadow:0 12px 36px #102b4610">
      <p style="color:#ef8b36;font-weight:800;letter-spacing:.12em">WAYLINE</p><h1>You're offline</h1>
      <p>The app shell is available, and previously loaded shipment information may still be available on this device. Reconnect to refresh live data.</p>
      <button onclick="location.reload()" style="border:0;border-radius:10px;padding:12px 18px;background:#ef8b36;color:#182b40;font-weight:700">Try again</button>
    </main>
  </body>
</html>
